<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALAXY HERO</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for retro/neon styling -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0c0f12;
      overflow: hidden;
    }
    .neon-text {
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.8), 0 0 20px rgba(0, 242, 254, 0.5);
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5), inset 0 0 15px rgba(0, 242, 254, 0.2);
      border: 2px solid rgba(0, 242, 254, 0.8);
    }
    .skill-btn-glow {
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.6);
    }
    /* Hide scrollbars */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center m-0 p-0 relative">

  <!-- Main Game Frame -->
  <div id="game-container" class="relative w-full h-full max-w-[1024px] max-h-[768px] aspect-[4/3] bg-black overflow-hidden md:rounded-2xl md:shadow-2xl md:border md:border-slate-800">
    
    <!-- Canvas for Space and Particles -->
    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full block"></canvas>

    <!-- HUD Overlay (During Gameplay) -->
    <div id="hud" class="absolute inset-0 pointer-events-none hidden flex flex-col justify-between p-6">
      <!-- Top Bar -->
      <div class="flex justify-between items-start w-full">
        <!-- Score & Weapon level -->
        <div class="flex flex-col gap-1">
          <div class="text-cyan-400 font-black text-xl md:text-2xl drop-shadow-md">
            SCORE: <span id="hud-score">0</span>
          </div>
          <div class="text-yellow-400 font-bold text-sm md:text-md">
            WPN: <span id="hud-wpn">1</span>
          </div>
        </div>
        <!-- Hearts / HP -->
        <div class="flex items-center gap-1.5" id="hud-hearts">
          <!-- Hearts rendered dynamically in JS -->
        </div>
      </div>

      <!-- Bottom Bar with Skill Button -->
      <div class="flex justify-between items-end w-full">
        <!-- Message box for in-game notifications (instead of alert) -->
        <div id="toast-message" class="text-center text-xs md:text-sm text-yellow-300 font-bold bg-black/60 px-4 py-2 rounded-lg opacity-0 transition-opacity duration-300">
          WEAPON UPGRADE!
        </div>
        <!-- Skill Button Container (Interactive only) -->
        <div class="pointer-events-auto">
          <button id="skill-btn" class="relative w-16 h-16 md:w-20 md:h-20 rounded-full border-2 border-yellow-500 bg-black/70 flex items-center justify-center skill-btn-glow transition active:scale-95">
            <!-- Progress indicator ring inside SVG -->
            <svg class="absolute inset-0 w-full h-full -rotate-90">
              <circle cx="50%" cy="50%" r="45%" stroke="#eab308" stroke-width="4" fill="transparent" class="transition-all duration-100" stroke-dasharray="250" stroke-dashoffset="0" id="skill-cooldown-ring" />
            </svg>
            <!-- Lightning icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 md:h-10 md:w-10 text-yellow-400" fill="currentColor" viewBox="0 0 24 24">
              <path d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Menu / Lobby Screen (Matching image_15d9a2.png) -->
    <div id="main-menu" class="absolute inset-0 bg-black/40 backdrop-blur-[2px] flex items-center justify-center p-4">
      <div class="neon-border bg-[#0a0d10]/95 w-full max-w-[420px] rounded-3xl p-6 md:p-8 flex flex-col items-center text-center">
        <!-- Title -->
        <h1 class="text-3xl md:text-4xl font-black text-cyan-400 tracking-wider mb-6 neon-text">
          GALAXY HERO
        </h1>

        <!-- Upgrades / Selection Badges -->
        <div class="grid grid-cols-4 gap-2 w-full mb-6">
          <button id="badge-atk" class="py-1.5 px-1 rounded-md text-[10px] md:text-xs font-bold bg-red-600/30 text-red-400 border border-red-500 hover:bg-red-600/50 transition duration-150">
            공격력
          </button>
          <button id="badge-shd" class="py-1.5 px-1 rounded-md text-[10px] md:text-xs font-bold bg-blue-600/30 text-blue-400 border border-blue-500 hover:bg-blue-600/50 transition duration-150">
            보호막
          </button>
          <button id="badge-ult" class="py-1.5 px-1 rounded-md text-[10px] md:text-xs font-bold bg-yellow-600/30 text-yellow-400 border border-yellow-500 hover:bg-yellow-600/50 transition duration-150">
            초필살기
          </button>
          <button id="badge-rec" class="py-1.5 px-1 rounded-md text-[10px] md:text-xs font-bold bg-pink-600/30 text-pink-400 border border-pink-500 hover:bg-pink-600/50 transition duration-150">
            H.P. 회복
          </button>
        </div>

        <!-- Instructions (Matching exact text from user image) -->
        <div class="text-gray-300 text-xs md:text-sm leading-relaxed mb-8 flex flex-col gap-2 font-semibold">
          <p>PC: <span class="text-cyan-400">WASD</span> 이동, <span class="text-cyan-400">Z</span> 스킬</p>
          <p>모바일: <span class="text-cyan-400">화면 드래그</span> 이동, <span class="text-yellow-400">⚡</span> 스킬</p>
          <p class="text-yellow-400/90 text-[11px] md:text-xs">(터치/드래그 시 자동 발사)</p>
          <p class="text-gray-400 text-[10px] md:text-xs mt-1">스킬은 시간이 지나면 충전됩니다!</p>
        </div>

        <!-- Start Sortie Button -->
        <button id="start-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-white font-extrabold text-lg py-3 rounded-full shadow-[0_4px_14px_rgba(6,182,212,0.5)] transition duration-250 active:scale-95">
          출격
        </button>

        <!-- Sound option helper -->
        <div class="mt-4 text-[9px] text-slate-500 font-bold">
          ※ 쾌적한 플레이를 위해 기기 소리를 켜주세요 (자체 효과음 지원)
        </div>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-4 hidden">
      <div class="text-center max-w-sm w-full bg-slate-900/90 rounded-3xl p-6 border border-red-500/50">
        <h2 class="text-3xl font-black text-red-500 tracking-wider mb-2">GAME OVER</h2>
        <p class="text-slate-400 text-sm mb-6">최종 점수</p>
        <p id="final-score" class="text-5xl font-black text-cyan-400 mb-8 tracking-widest">0</p>
        
        <button id="retry-btn" class="w-full bg-red-600 hover:bg-red-500 text-white font-black text-md py-3 rounded-full transition duration-150 active:scale-95 shadow-[0_4px_10px_rgba(239,68,68,0.3)]">
          다시 출격
        </button>
      </div>
    </div>

  </div>

  <script>
    // Simple synthesized sound generator for rich audio feedback without external loads
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'shoot') {
          // Sharp retro laser shot sound
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'explosion') {
          // Low pitch noisy explosion
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'powerup') {
          // Rising crystal clear chiptune sound
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.1);
          osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'skill') {
          // Thunder shockwave sound
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(30, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.4);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.8);
          osc.start(now);
          osc.stop(now + 0.8);
        } else if (type === 'hurt') {
          // Discordant low tone buzz
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.setValueAtTime(80, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {
        console.warn("Audio Context Error: ", e);
      }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    // UI elements
    const menuEl = document.getElementById('main-menu');
    const hudEl = document.getElementById('hud');
    const gameOverEl = document.getElementById('game-over');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const scoreVal = document.getElementById('hud-score');
    const wpnVal = document.getElementById('hud-wpn');
    const heartsContainer = document.getElementById('hud-hearts');
    const finalScoreEl = document.getElementById('final-score');
    const skillBtn = document.getElementById('skill-btn');
    const skillRing = document.getElementById('skill-cooldown-ring');
    const toastMessage = document.getElementById('toast-message');

    // Upgrades Selection
    const badgeAtk = document.getElementById('badge-atk');
    const badgeShd = document.getElementById('badge-shd');
    const badgeUlt = document.getElementById('badge-ult');
    const badgeRec = document.getElementById('badge-rec');

    // Canvas scaling logic
    let viewWidth = 800;
    let viewHeight = 600;

    function resizeCanvas() {
      // Scale canvas back buffer depending on viewport but keeping aspect ratio
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      viewWidth = rect.width;
      viewHeight = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let score = 0;
    let maxLives = 3;
    let lives = 3;
    let weaponLevel = 1; // 1 to 3
    let activeBonus = null; // 'ATK', 'SHIELD', 'ULT', 'HP' (Selected at Lobby)

    // Player Settings
    let player = {
      x: 0,
      y: 0,
      width: 32,
      height: 32,
      speed: 6,
      invincible: 0, // frame counter
      shieldActive: false // special upgrade shield
    };

    // Input States
    let keys = {};
    let touchX = null;
    let touchY = null;
    let isTouching = false;

    // Entity Lists
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let powerups = [];
    let particles = [];
    let backgroundStars = [];
    let skillShockwaves = [];

    // Timers & Cooldowns
    let shootCooldown = 0;
    const shootRate = 12; // Auto shoot every 12 frames
    let skillCharge = 100; // 0 to 100%
    const skillCooldownRate = 0.25; // Speed of charge recovery
    let enemySpawnTimer = 0;

    // Starfield Initialization
    function initStars() {
      backgroundStars = [];
      for (let i = 0; i < 80; i++) {
        backgroundStars.push({
          x: Math.random() * viewWidth,
          y: Math.random() * viewHeight,
          size: Math.random() * 2 + 0.5,
          speed: Math.random() * 2 + 0.5
        });
      }
    }

    // Handle Lobby Badge selections
    const badges = [
      { el: badgeAtk, type: 'ATK' },
      { el: badgeShd, type: 'SHIELD' },
      { el: badgeUlt, type: 'ULT' },
      { el: badgeRec, type: 'HP' }
    ];

    badges.forEach(b => {
      b.el.addEventListener('click', () => {
        // Clear all active looks
        badges.forEach(badge => {
          badge.el.classList.remove('ring-4', 'ring-cyan-300', 'scale-105');
        });
        // Select this one
        activeBonus = b.type;
        b.el.classList.add('ring-4', 'ring-cyan-300', 'scale-105');
        playSound('powerup');
      });
    });

    // Default select ATK
    badgeAtk.click();

    // Key Events
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'z') {
        triggerSkill();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    // Touch and Drag Controls (Relative movement to feel seamless like high-end arcade games)
    let lastTouchX = null;
    let lastTouchY = null;

    container.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      const rect = container.getBoundingClientRect();
      lastTouchX = touch.clientX - rect.left;
      lastTouchY = touch.clientY - rect.top;
      isTouching = true;
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      const touch = e.touches[0];
      const rect = container.getBoundingClientRect();
      const curX = touch.clientX - rect.left;
      const curY = touch.clientY - rect.top;

      // Calculate delta to move relative
      const dx = curX - lastTouchX;
      const dy = curY - lastTouchY;

      player.x += dx;
      player.y += dy;

      // Clamp player within viewport boundaries
      player.x = Math.max(player.width, Math.min(viewWidth - player.width, player.x));
      player.y = Math.max(player.height, Math.min(viewHeight - player.height, player.y));

      lastTouchX = curX;
      lastTouchY = curY;
    }, { passive: true });

    container.addEventListener('touchend', () => {
      isTouching = false;
      lastTouchX = null;
      lastTouchY = null;
    });

    skillBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerSkill();
    });

    function showToast(text) {
      toastMessage.textContent = text;
      toastMessage.style.opacity = '1';
      setTimeout(() => {
        toastMessage.style.opacity = '0';
      }, 1500);
    }

    function startGame() {
      // Audio trigger safely inside click handler
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // Hide Menu & Show HUD
      menuEl.classList.add('hidden');
      gameOverEl.classList.add('hidden');
      hudEl.classList.remove('hidden');

      // Set/Reset Parameters
      score = 0;
      weaponLevel = 1;
      skillCharge = 100;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      powerups = [];
      particles = [];
      skillShockwaves = [];

      // Apply Badge selection effects
      maxLives = activeBonus === 'HP' ? 4 : 3;
      lives = maxLives;
      player.speed = 6;
      player.shieldActive = activeBonus === 'SHIELD';
      if (activeBonus === 'ATK') {
        // Start with weapon tier 2 if ATK bonus active
        weaponLevel = 2;
      }

      // Dynamic canvas refresh
      resizeCanvas();
      initStars();

      // Set Player to bottom-center
      player.x = viewWidth / 2;
      player.y = viewHeight * 0.8;
      player.invincible = 60; // Spawn shield frames

      updateHeartsUI();
      scoreVal.textContent = score;
      wpnVal.textContent = weaponLevel;

      // Run Game Loop
      isPlaying = true;
      requestAnimationFrame(gameLoop);
    }

    let isPlaying = false;

    startBtn.addEventListener('click', startGame);
    retryBtn.addEventListener('click', startGame);

    function updateHeartsUI() {
      heartsContainer.innerHTML = '';
      for (let i = 0; i < maxLives; i++) {
        const heart = document.createElement('div');
        heart.className = "w-5 h-5 flex items-center justify-center transition-all duration-300";
        if (i < lives) {
          // Red Heart SVG
          heart.innerHTML = `
            <svg class="w-full h-full text-red-500 fill-current" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          `;
        } else {
          // Hollow Heart SVG
          heart.innerHTML = `
            <svg class="w-full h-full text-slate-700 fill-current" viewBox="0 0 24 24">
              <path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/>
            </svg>
          `;
        }
        heartsContainer.appendChild(heart);
      }
    }

    function spawnExplosion(x, y, color = '#f97316', count = 12) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 3 + 1,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
      playSound('explosion');
    }

    function triggerSkill() {
      if (skillCharge >= 100) {
        skillCharge = 0;
        playSound('skill');

        // Create expanding neon shockwave
        skillShockwaves.push({
          x: player.x,
          y: player.y,
          radius: 10,
          maxRadius: viewWidth * 1.2,
          speed: 15
        });

        // Clear all currently active screen threats
        enemies.forEach(enemy => {
          spawnExplosion(enemy.x, enemy.y, '#f59e0b', 16);
          score += 50;
        });
        enemies = [];
        enemyBullets = [];

        scoreVal.textContent = score;
        showToast("⚡ 초필살기 발동! ⚡");
      }
    }

    function spawnEnemy() {
      // Pick random positions & types
      const x = Math.random() * (viewWidth - 60) + 30;
      const r = Math.random();
      let type = 'orange';
      let hp = 1;
      let scoreReward = 10;
      let speed = Math.random() * 1.5 + 2;

      if (r < 0.3) {
        type = 'red'; // Faster, dynamic moves
        hp = 1;
        scoreReward = 15;
        speed = Math.random() * 2 + 3.5;
      } else if (r < 0.45) {
        type = 'yellow'; // Heavy tank, fires back
        hp = 3;
        scoreReward = 30;
        speed = 1.2;
      }

      enemies.push({
        x: x,
        y: -40,
        width: 30,
        height: 30,
        speed: speed,
        type: type,
        hp: hp,
        maxHp: hp,
        scoreReward: scoreReward,
        shootTimer: Math.random() * 60,
        xOsc: Math.random() > 0.5 ? 1 : -1 // Sinusoidal sway factor
      });
    }

    function playerShoot() {
      const bulletSpeed = -10;
      playSound('shoot');

      if (weaponLevel === 1) {
        // Single Center shot
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: bulletSpeed, color: '#22d3ee' });
      } else if (weaponLevel === 2) {
        // Dual Parallel shots
        bullets.push({ x: player.x - 12, y: player.y - 10, vx: 0, vy: bulletSpeed, color: '#22d3ee' });
        bullets.push({ x: player.x + 12, y: player.y - 10, vx: 0, vy: bulletSpeed, color: '#22d3ee' });
      } else {
        // Triple Spread shots
        bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: bulletSpeed, color: '#22d3ee' });
        bullets.push({ x: player.x - 14, y: player.y - 10, vx: -2.5, vy: bulletSpeed, color: '#22d3ee' });
        bullets.push({ x: player.x + 14, y: player.y - 10, vx: 2.5, vy: bulletSpeed, color: '#22d3ee' });
      }
    }

    function hurtPlayer() {
      if (player.invincible > 0) return;

      if (player.shieldActive) {
        // Turn off passive badge shield instead of losing health
        player.shieldActive = false;
        player.invincible = 90; // generous frames
        playSound('powerup');
        showToast("🛡️ 보호막 소모!");
        return;
      }

      lives--;
      playSound('hurt');
      updateHeartsUI();

      if (lives <= 0) {
        gameOver();
      } else {
        player.invincible = 90; // Invincibility frames
        player.x = viewWidth / 2;
        player.y = viewHeight * 0.8;
      }
    }

    function gameOver() {
      isPlaying = false;
      hudEl.classList.add('hidden');
      gameOverEl.classList.remove('hidden');
      finalScoreEl.textContent = score;
    }

    function update() {
      // 1. Update background star parallax
      backgroundStars.forEach(star => {
        star.y += star.speed;
        if (star.y > viewHeight) {
          star.y = 0;
          star.x = Math.random() * viewWidth;
        }
      });

      // 2. Player Movement (PC controls)
      if (keys['a'] || keys['arrowleft']) {
        player.x -= player.speed;
      }
      if (keys['d'] || keys['arrowright']) {
        player.x += player.speed;
      }
      if (keys['w'] || keys['arrowup']) {
        player.y -= player.speed;
      }
      if (keys['s'] || keys['arrowdown']) {
        player.y += player.speed;
      }

      // Constrain player movement inside screen bounds
      player.x = Math.max(player.width, Math.min(viewWidth - player.width, player.x));
      player.y = Math.max(player.height, Math.min(viewHeight - player.height, player.y));

      // Invincible frame decrement
      if (player.invincible > 0) player.invincible--;

      // 3. Auto-Shooting
      if (shootCooldown > 0) {
        shootCooldown--;
      } else {
        playerShoot();
        shootCooldown = shootRate;
      }

      // 4. Update Friendly Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -10 || b.x < -10 || b.x > viewWidth + 10) {
          bullets.splice(i, 1);
        }
      }

      // 5. Update Enemy Bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        // Collision with player
        const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
        if (dist < player.width / 2 + 3) {
          hurtPlayer();
          enemyBullets.splice(i, 1);
          continue;
        }

        if (eb.y > viewHeight + 10) {
          enemyBullets.splice(i, 1);
        }
      }

      // 6. Update Shockwaves
      for (let i = skillShockwaves.length - 1; i >= 0; i--) {
        const sw = skillShockwaves[i];
        sw.radius += sw.speed;
        if (sw.radius > sw.maxRadius) {
          skillShockwaves.splice(i, 1);
        }
      }

      // 7. Update Enemies
      enemySpawnTimer--;
      if (enemySpawnTimer <= 0) {
        spawnEnemy();
        // Dynamically scale difficulty based on score
        enemySpawnTimer = Math.max(25, 60 - Math.floor(score / 500) * 4);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        
        // Sway / Movement pattern
        if (e.type === 'red') {
          e.y += e.speed;
          e.x += Math.sin(e.y * 0.05) * 2 * e.xOsc;
        } else if (e.type === 'yellow') {
          e.y += e.speed;
          // Slowly fires downward target shots
          e.shootTimer--;
          if (e.shootTimer <= 0) {
            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({
              x: e.x,
              y: e.y + 10,
              vx: Math.cos(angle) * 4,
              vy: Math.sin(angle) * 4
            });
            e.shootTimer = 90; // cooldown
          }
        } else {
          e.y += e.speed;
        }

        // Check if collision with player ship directly
        const dist = Math.hypot(e.x - player.x, e.y - player.y);
        if (dist < player.width / 2 + e.width / 2) {
          spawnExplosion(e.x, e.y, '#ef4444', 12);
          hurtPlayer();
          enemies.splice(i, 1);
          continue;
        }

        // Check collision with friendly bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const bDist = Math.hypot(b.x - e.x, b.y - e.y);
          if (bDist < e.width / 2 + 4) {
            e.hp--;
            bullets.splice(j, 1);

            // Flash enemy damage visual
            e.hitFlash = 4;

            if (e.hp <= 0) {
              spawnExplosion(e.x, e.y, e.type === 'red' ? '#ef4444' : e.type === 'yellow' ? '#f59e0b' : '#f97316', 15);
              score += e.scoreReward;
              scoreVal.textContent = score;

              // Chance of Weapon item drop
              if (Math.random() < 0.18) {
                powerups.push({
                  x: e.x,
                  y: e.y,
                  width: 18,
                  height: 18,
                  speed: 2
                });
              }

              enemies.splice(i, 1);
              break;
            }
          }
        }

        // Out of boundary cleanup
        if (e && e.y > viewHeight + 30) {
          enemies.splice(i, 1);
        }
      }

      // 8. Update Powerups
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.y += p.speed;

        // Check collection
        const dist = Math.hypot(p.x - player.x, p.y - player.y);
        if (dist < player.width / 2 + p.width / 2) {
          playSound('powerup');
          if (weaponLevel < 3) {
            weaponLevel++;
            wpnVal.textContent = weaponLevel;
            showToast("WEAPON UPGRADE!");
          } else {
            score += 150;
            scoreVal.textContent = score;
            showToast("+150 POINTS!");
          }
          powerups.splice(i, 1);
          continue;
        }

        if (p.y > viewHeight + 20) {
          powerups.splice(i, 1);
        }
      }

      // 9. Particles physics
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // 10. Update Skill Cooldown Progress
      if (skillCharge < 100) {
        skillCharge += activeBonus === 'ULT' ? skillCooldownRate * 1.5 : skillCooldownRate;
        if (skillCharge > 100) skillCharge = 100;
      }
      // Circular progress bar calculations (250 stroke offset mapping to 0-100%)
      const offset = 250 - (250 * (skillCharge / 100));
      skillRing.setAttribute('stroke-dashoffset', offset);
    }

    function draw() {
      // Clear with soft space gradient background
      ctx.fillStyle = '#06080a';
      ctx.fillRect(0, 0, viewWidth, viewHeight);

      // Stars
      ctx.fillStyle = '#ffffff';
      backgroundStars.forEach(star => {
        ctx.globalAlpha = star.size * 0.3;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      });
      ctx.globalAlpha = 1;

      // Draw Shockwaves
      skillShockwaves.forEach(sw => {
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(234, 179, 8, ${1 - (sw.radius / sw.maxRadius)})`;
        ctx.lineWidth = 6;
        ctx.stroke();
      });

      // Powerup items
      powerups.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Draw spinning gold diamond star item
        ctx.rotate((Date.now() / 200) % (Math.PI * 2));
        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.moveTo(0, -p.height / 2);
        ctx.lineTo(p.width / 2, 0);
        ctx.lineTo(0, p.height / 2);
        ctx.lineTo(-p.width / 2, 0);
        ctx.closePath();
        ctx.fill();

        // Inner core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, p.width / 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Player Ship (Sleek cyan spacecraft)
      if (player.invincible === 0 || Math.floor(player.invincible / 4) % 2 === 0) {
        ctx.save();
        ctx.translate(player.x, player.y);

        // Optional Glowing Engine Flame effect
        const flameOffset = Math.sin(Date.now() * 0.1) * 3;
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(-6, 12);
        ctx.lineTo(0, 20 + flameOffset);
        ctx.lineTo(6, 12);
        ctx.closePath();
        ctx.fill();

        // Main Hull Arrow Shape
        ctx.fillStyle = '#06b6d4'; // Cyan primary
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -18); // Tip
        ctx.lineTo(14, 12);  // Right wing
        ctx.lineTo(4, 6);    // Inner right notch
        ctx.lineTo(-4, 6);   // Inner left notch
        ctx.lineTo(-14, 12); // Left wing
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Wing highlights
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.lineTo(10, 10);
        ctx.lineTo(0, 5);
        ctx.lineTo(-10, 10);
        ctx.closePath();
        ctx.fill();

        // Active Shield Visual (Passive badge effect)
        if (player.shieldActive) {
          ctx.beginPath();
          ctx.arc(0, 0, 26, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        ctx.restore();
      }

      // Extra Invincibility Spawn Bubble
      if (player.invincible > 0) {
        ctx.beginPath();
        ctx.arc(player.x, player.y, 30, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(34, 211, 238, 0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // Friendly Bullets
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
        // Bullet Light glow
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.fill();
        ctx.shadowBlur = 0; // Reset
      });

      // Enemy Ships
      enemies.forEach(e => {
        ctx.save();
        ctx.translate(e.x, e.y);

        // Swap design/color depending on types
        if (e.type === 'red') {
          ctx.fillStyle = '#ef4444'; // Red
        } else if (e.type === 'yellow') {
          ctx.fillStyle = '#f59e0b'; // Gold
        } else {
          ctx.fillStyle = '#f97316'; // Orange default
        }

        // Damage hit flashing mechanism
        if (e.hitFlash && e.hitFlash > 0) {
          ctx.fillStyle = '#ffffff';
          e.hitFlash--;
        }

        // Draw Arrowhead pointing downwards
        ctx.beginPath();
        ctx.moveTo(0, 16);    // Point nose down
        ctx.lineTo(-12, -12); // Right wing top
        ctx.lineTo(0, -4);    // Center back
        ctx.lineTo(12, -12);  // Left wing top
        ctx.closePath();
        ctx.fill();

        // Inner engine core
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -6, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      // Enemy Bullets
      ctx.fillStyle = '#f97316';
      enemyBullets.forEach(eb => {
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Explosion Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
    }

    function gameLoop() {
      if (!isPlaying) return;

      update();
      draw();

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
